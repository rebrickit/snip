name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: '16.4'
          - runner: macos-26
            xcode: '26.6'
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      # CI validates local ad hoc builds without Developer ID credentials.
      SNIP_SIGN_ID: '-'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation tools
        run: brew install just actionlint shellcheck

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          just --version
          actionlint --version
          shellcheck --version

      - name: Lint, test, build, and validate packaging
        run: just ci

      - name: Upload local validation build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Snip-local-${{ matrix.runner }}
          path: |
            dist/Snip-*-local.dmg
            dist/Snip-*-local.dmg.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
